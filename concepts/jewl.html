<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jewl Fine Jewelry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap">
<script>
try{
  var d=document.documentElement,t=localStorage.getItem('jewl-theme'),l=localStorage.getItem('jewl-lang');
  if(t)d.setAttribute('data-theme',t);
  if(l){d.lang=l;d.dir=l==='ar'?'rtl':'ltr'}
}catch(e){}
</script>
<style>
/* ================= Tokens ================= */
:root{
  --bg:#F4FBFC;
  --surface:#FFFFFF;
  --ink:#0B3440;
  --muted:#4D6D76;
  --line:rgba(11,52,64,.13);
  --accent:#0A7C88;
  --gold:#8C6A1C;
  --chip:#E3F4F7;
  --ph-a:#F1FBFC;
  --ph-b:#CBEDF3;
  --caustic:rgba(255,255,255,.75);
  --band-a:#D8F3F7;
  --band-b:#A9E2EB;
  --band-muted:#3B6470;
  --blob1:#8FE3EE;
  --blob2:#46CDD3;
  --blob3:#F3DA95;
  --scrim:rgba(4,30,38,.45);
  --shadow:0 30px 60px -32px rgba(11,52,64,.45);
  --g-yellow:linear-gradient(100deg,#A47A25 0%,#F4DE98 32%,#C79E45 52%,#F0D788 72%,#9A7322 100%);
  --g-white:linear-gradient(100deg,#7F8A97 0%,#FFFFFF 32%,#AEB8C3 52%,#F4F7FA 72%,#76818E 100%);
  --g-rose:linear-gradient(100deg,#955544 0%,#F7D2BF 32%,#C98870 52%,#F5CDB9 72%,#8A4C3C 100%);
  --brand:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --gutter:clamp(16px,4vw,48px);
  --max:1260px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#041A20; --surface:#0A2A33; --ink:#E4F6F8; --muted:#95BEC6; --line:rgba(127,220,230,.17);
    --accent:#5FE0EA; --gold:#E4C57C; --chip:#0D3540; --ph-a:#0B3A45; --ph-b:#03181E;
    --caustic:rgba(127,220,230,.2); --band-a:#062A33; --band-b:#0A4553; --band-muted:#9CC6CD;
    --blob1:#0F7F8C; --blob2:#11A9B5; --blob3:#5E4C1C; --scrim:rgba(0,8,12,.65);
    --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#041A20; --surface:#0A2A33; --ink:#E4F6F8; --muted:#95BEC6; --line:rgba(127,220,230,.17);
  --accent:#5FE0EA; --gold:#E4C57C; --chip:#0D3540; --ph-a:#0B3A45; --ph-b:#03181E;
  --caustic:rgba(127,220,230,.2); --band-a:#062A33; --band-b:#0A4553; --band-muted:#9CC6CD;
  --blob1:#0F7F8C; --blob2:#11A9B5; --blob3:#5E4C1C; --scrim:rgba(0,8,12,.65);
  --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark;
}
/* Per-language type: every script gets a calligraphic accent face and a matching serif */
html:lang(ru){--script:"Marck Script",cursive;--display:"Cormorant","Bodoni Moda",Georgia,serif}
html:lang(zh){--script:"Ma Shan Zheng",cursive;--display:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC",sans-serif}
html:lang(ja){--script:"Yuji Syuku",serif;--display:"Shippori Mincho","Hiragino Mincho ProN",serif;--sans:"Noto Sans JP","Hiragino Sans",sans-serif}
html:lang(ar){--script:"Aref Ruqaa",serif;--display:"Amiri",serif;--sans:"IBM Plex Sans Arabic",Tahoma,sans-serif}
html:lang(zh) em,html:lang(ja) em{font-style:normal}
html:lang(ar) *{letter-spacing:0!important}
html:lang(zh) .eyebrow,html:lang(ja) .eyebrow{letter-spacing:.12em}

/* ================= Base ================= */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .5s,color .5s}
body.locked{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter)}
.eyebrow{font:500 12px/1.3 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:clamp(32px,4.4vw,54px)}
.s{font-family:var(--script);font-weight:400;font-style:normal;color:var(--gold);font-size:1.18em;line-height:.9}
.brand{font-family:var(--brand);font-weight:400;line-height:1}
.num{font-variant-numeric:tabular-nums lining-nums}
.gild{background:var(--g-yellow);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= Buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;border:1px solid currentColor;background:none;padding:1em 1.9em;font:500 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:background-color .3s,color .3s,background-position .8s var(--ease),transform .3s var(--ease)}
.btn-gold{background:var(--g-yellow);background-size:220% 100%;border:0;color:#2A1E05;padding:calc(1em + 1px) calc(1.9em + 1px)}
.btn-gold:hover{background-position:100% 0;transform:translateY(-2px)}
.btn-line{color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--bg)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-ink:hover{background:transparent;color:var(--ink)}
.btn-block{width:100%}

/* ================= Loader ================= */
.loader{position:fixed;inset:0;z-index:200;display:grid;place-items:center;align-content:center;gap:22px;background:var(--bg);overflow:hidden;transition:opacity .9s var(--ease),visibility .9s;animation:loaderOut .9s 6s forwards}
.loader.done{opacity:0;visibility:hidden;pointer-events:none}
@keyframes loaderOut{to{opacity:0;visibility:hidden}}
.loader .aurora{opacity:.8}
.loader-mark{position:relative;font-family:var(--brand);font-size:clamp(110px,20vw,190px);line-height:1;padding:0 .12em;direction:ltr;clip-path:inset(0 100% 0 0);animation:write 1.7s .15s var(--ease) forwards,gleam 3s 1.2s ease-in-out infinite}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.loader-line{position:relative;width:min(220px,60vw);height:1px;background:var(--line);overflow:hidden}
.loader-line i{position:absolute;inset:0;background:var(--g-yellow);transform-origin:left;transform:scaleX(0);animation:fill 1.9s var(--ease) forwards}
@keyframes fill{to{transform:scaleX(1)}}
.loader p{position:relative;margin:0;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);text-align:center;padding-inline:16px}
@keyframes gleam{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* ================= Aurora (water light) ================= */
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--blob1);top:-25vmax;inset-inline-start:-10vmax}
.aurora i:nth-child(2){background:var(--blob2);bottom:-30vmax;inset-inline-end:-15vmax;animation-duration:28s;opacity:.4}
.aurora i:nth-child(3){background:var(--blob3);top:10%;inset-inline-start:45%;width:30vmax;height:30vmax;opacity:.35;animation-duration:18s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.15)}}

/* ================= Announcement + header ================= */
.announce{position:relative;background:var(--ink);color:var(--bg);text-align:center;font:400 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:10px var(--gutter)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:78px;gap:16px}
.nav-links{display:flex;gap:28px;list-style:none;margin:0;padding:0;font:400 12.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.nav-links a{text-decoration:none;padding-block:6px;background:var(--g-yellow) 0 100%/0 1px no-repeat;transition:background-size .4s var(--ease)}
html[dir="rtl"] .nav-links a{background-position:100% 100%}
.nav-links a:hover{background-size:100% 1px}
.logo{font-family:var(--brand);font-size:56px;line-height:1;text-decoration:none;padding:6px .1em 0;direction:ltr}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.tool{position:relative;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:0;background:none;border-radius:20px;font:400 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;transition:background-color .2s}
.tool:hover,.tool[aria-expanded="true"]{background:var(--chip)}
.tool .glyph{font-size:17px;letter-spacing:0;line-height:1}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--g-yellow);color:#2A1E05;font:500 10px/18px var(--sans);letter-spacing:0;text-align:center}
.menu-btn{display:none}
.lang-wrap{position:relative}
.lang-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:60;min-width:200px;margin:0;padding:8px;list-style:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:2px}
.lang-menu button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;border:0;background:none;padding:10px 12px;text-align:start;font:400 15px/1.2 var(--sans)}
.lang-menu button:hover{background:var(--chip)}
.lang-menu button small{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.lang-menu button[aria-current="true"]{color:var(--accent)}
.lang-menu button[aria-current="true"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--g-yellow);margin-inline-start:auto}
.mobile-nav{display:flex;flex-wrap:wrap;gap:8px 20px;padding-block:0 16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.mobile-nav a{text-decoration:none}

/* ================= Product image slots (placeholders for photography) ================= */
.ph{position:relative;display:grid;place-items:center;overflow:hidden;container-type:inline-size;
  background:
    radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.35),transparent 38%),
    radial-gradient(52% 42% at 50% 64%,color-mix(in srgb,var(--stone) 75%,transparent),transparent 72%),
    linear-gradient(172deg,var(--ph-a),var(--ph-b));
  border-radius:50% 50% 0 0/40% 40% 0 0;
  isolation:isolate}
.ph::before{content:"";position:absolute;inset:-20%;z-index:-1;background:
  radial-gradient(18% 10% at 30% 30%,var(--caustic),transparent 70%),
  radial-gradient(14% 8% at 70% 44%,var(--caustic),transparent 70%),
  radial-gradient(22% 9% at 45% 78%,var(--caustic),transparent 70%),
  radial-gradient(10% 6% at 20% 62%,var(--caustic),transparent 70%);
  animation:caustic 14s ease-in-out infinite alternate;opacity:.8}
@keyframes caustic{from{transform:translate(-3%,-2%) rotate(-3deg)}to{transform:translate(3%,3%) rotate(4deg)}}
.ph::after{content:"";position:absolute;inset:auto 18% 9% 18%;height:1px;background:var(--g-yellow);opacity:.55}
.ph-initial{font-family:var(--brand);font-size:52cqi;line-height:1;padding:0 .12em;margin-top:.05em;background:var(--metal-g);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 6px 14px rgba(8,50,60,.22));transition:transform .8s var(--ease),background-position 1.2s var(--ease);direction:ltr}
.ph[data-metal="yellow"]{--metal-g:var(--g-yellow)}
.ph[data-metal="white"]{--metal-g:var(--g-white)}
.ph[data-metal="rose"]{--metal-g:var(--g-rose)}
.ph[data-stone="aqua"]{--stone:#8FDDEB}
.ph[data-stone="paraiba"]{--stone:#19D3C5}
.ph[data-stone="topaz"]{--stone:#55AEEA}
.ph[data-stone="turq"]{--stone:#3EC1B4}

/* ================= Hero ================= */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--band-b) 55%,var(--bg)))}
.hero-grid{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:clamp(28px,5vw,72px);padding-block:clamp(40px,6vw,88px)}
.hero-mark{font-family:var(--brand);font-size:clamp(120px,16vw,230px);line-height:.82;margin:.1em 0 .02em;margin-inline-start:-.05em;padding-inline-end:.1em;direction:ltr;width:max-content;max-width:100%;animation:gleam 9s ease-in-out infinite}
html[dir="rtl"] .hero-mark{margin-inline-start:0}
.hero h1{font-size:clamp(34px,4.6vw,62px);max-width:15ch}
.hero h1 em{color:var(--accent)}
.lede{color:var(--muted);max-width:46ch;font-size:17px;margin:20px 0 32px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero-piece{justify-self:center;width:min(430px,100%);display:grid;gap:18px;perspective:1100px}
.arch-btn{border:0;padding:0;background:none;display:block;width:100%;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.arch-btn .ph{aspect-ratio:4/5;width:100%;box-shadow:var(--shadow)}
.arch-btn .ph-initial{font-size:56cqi}
.arch-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.arch-cap .brand{font-size:40px}
.arch-cap span:last-child{font-size:13px;color:var(--muted);letter-spacing:.06em;text-align:end}

/* ================= Marquee ================= */
.marquee{direction:ltr;overflow:hidden;border-block:1px solid var(--line);background:var(--surface);padding-block:16px}
.marquee-track{display:flex;width:max-content;animation:marquee 40s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee span{font:400 italic 22px/1 var(--display);padding-inline:26px;white-space:nowrap;display:inline-flex;align-items:center;gap:52px}
.marquee span::after{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--g-yellow)}
@keyframes marquee{to{transform:translateX(-50%)}}

/* ================= Standards ================= */
.standards ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.standards li{padding:28px 22px;display:grid;gap:4px;border-inline-start:1px solid var(--line)}
.standards li:first-child{border-inline-start:0;padding-inline-start:0}
.standards strong{font:400 22px/1.2 var(--display);font-style:italic}
.standards span{font-size:13.5px;color:var(--muted)}
html:lang(zh) .standards strong,html:lang(ja) .standards strong{font-style:normal}

/* ================= Section heads ================= */
section.block{padding-block:clamp(64px,8vw,116px)}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.head h2{margin-top:10px}

/* ================= Catalog ================= */
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:34px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px;position:relative}
.chip{position:relative;border:0;background:none;padding:.7em 1.1em;font:400 13px/1 var(--sans);letter-spacing:.1em;color:var(--muted);transition:color .3s}
.chip::after{content:"";position:absolute;inset-inline:1.1em;bottom:0;height:1px;background:var(--g-yellow);transform:scaleX(0);transition:transform .45s var(--ease)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink)}
.chip[aria-pressed="true"]::after{transform:scaleX(1)}
.chip .count{display:inline-block;margin-inline-start:6px;vertical-align:1px}
.sorter{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.sorter select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface) linear-gradient(45deg,transparent 50%,var(--muted) 50%) no-repeat calc(100% - 16px) 52%/5px 5px;color:var(--ink);padding:.65em 2.4em .65em 1em;font:400 13px/1.2 var(--sans);border-radius:0}
html[dir="rtl"] .sorter select{background-position:16px 52%;padding:.65em 1em .65em 2.4em}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,2.2vw,32px) clamp(14px,2vw,28px)}
.card{display:flex;flex-direction:column;gap:14px;animation:rise .7s var(--ease) both;animation-delay:calc(var(--d,0) * 60ms)}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
.card-media{perspective:900px}
.card-media .tilt{position:relative;transition:transform .6s var(--ease);transform-style:preserve-3d}
.card-media .ph{aspect-ratio:4/5;width:100%;cursor:pointer}
.card:hover .ph-initial{transform:scale(1.06);background-position:100% 0}
.actions{position:absolute;inset-inline:10px;bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:1px;opacity:0;transform:translateY(10px);transition:opacity .35s,transform .45s var(--ease)}
.card:hover .actions,.card:focus-within .actions{opacity:1;transform:none}
.actions button{border:0;padding:12px 6px;font:500 10.5px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background-color .2s,color .2s}
.actions button:hover{background:var(--ink);color:var(--bg)}
.card-info{display:grid;gap:6px}
.card-tag{font:500 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);min-height:11px}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3{font-size:21px}
.card h3 button{border:0;background:none;padding:0;font:inherit;text-align:start;background-image:var(--g-yellow);background-repeat:no-repeat;background-size:0 1px;background-position:0 100%;transition:background-size .4s var(--ease)}
.card h3 button:hover{background-size:100% 1px}
.card-spec{font-size:13px;color:var(--muted);min-height:2.6em}
.price{font:400 17px/1 var(--display);white-space:nowrap}
.heart{border:0;background:none;width:34px;height:34px;display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted);transition:transform .3s var(--ease),color .2s;flex:none}
.heart:hover{color:var(--gold);transform:scale(1.15)}
.heart[aria-pressed="true"]{color:var(--gold)}
.heart[aria-pressed="true"] span{display:inline-block;animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.4)}}
.swatches{display:flex;gap:6px}
.sw{width:18px;height:18px;border-radius:50%;border:0;padding:0;background:var(--sw);box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s,transform .2s}
.sw:hover{transform:scale(1.15)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.empty-grid{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--muted)}
.empty-grid .s{display:block;font-size:48px;margin-bottom:8px}
@media (hover:none){
  .actions{opacity:1;transform:none}
}

/* ================= Collections band ================= */
.band-sec{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--band-a),var(--band-b))}
.band-sec .head p{color:var(--band-muted)}
.colls{display:flex;gap:clamp(12px,1.6vw,20px);height:clamp(440px,48vw,560px)}
.coll{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:clamp(20px,2.4vw,32px);border:0;background:none;text-align:start;text-decoration:none;color:var(--ink);transition:flex-grow .8s var(--ease);overflow:hidden}
.coll .ph{position:absolute;inset:0;border-radius:50% 50% 0 0/28% 28% 0 0}
.coll .ph-initial{font-size:clamp(90px,14vw,180px);opacity:.9;transform:translateY(-18%)}
.coll > *:not(.ph){position:relative}
.coll .brand{font-size:clamp(52px,5.4vw,72px)}
.coll p{margin:0;font-size:14px;color:var(--muted);max-width:32ch}
.coll small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.coll:hover,.coll:focus-visible{flex-grow:1.7}
.coll:hover .ph-initial{transform:translateY(-22%) scale(1.06)}

/* ================= Engraving studio ================= */
.studio{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,80px);align-items:center}
.stage{position:relative;display:grid;place-items:center;align-content:center;gap:24px;min-height:clamp(360px,42vw,520px);padding:clamp(24px,4vw,48px);border-radius:50% 50% 0 0/26% 26% 0 0;overflow:hidden;--stone:#8FDDEB}
.stage.ph .band{z-index:1}
.band{position:relative;width:100%;max-width:520px;height:clamp(96px,13vw,132px);border-radius:16px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(180deg,var(--m-dark) 0%,var(--m-light) 20%,var(--m-mid) 50%,var(--m-light) 80%,var(--m-dark) 100%);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.28),inset 0 -2px 6px rgba(255,255,255,.35),0 28px 50px -24px rgba(5,40,50,.55);
  transform:perspective(900px) rotateX(16deg);transition:background .6s}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 5.5s 2s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.band[data-metal="yellow"]{--m-dark:#8C6A1E;--m-light:#F6E3A2;--m-mid:#C9A24A;--m-ink:#5A4210}
.band[data-metal="white"]{--m-dark:#78828F;--m-light:#FFFFFF;--m-mid:#BCC5CF;--m-ink:#3A4350}
.band[data-metal="rose"]{--m-dark:#8E5040;--m-light:#F8D5C3;--m-mid:#C98870;--m-ink:#5E2E22}
.engr{position:relative;z-index:1;max-width:92%;padding-inline:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--m-ink);opacity:.82;text-shadow:0 1px 0 rgba(255,255,255,.6),0 -1px 0 rgba(0,0,0,.3);transition:font-size .3s}
.engr[data-font="script"]{font:400 clamp(34px,5vw,50px)/1.3 "Pinyon Script",var(--script)}
.engr[data-font="roman"]{font:400 italic clamp(24px,3.4vw,34px)/1.3 "Bodoni Moda",var(--display)}
.engr[data-font="caps"]{font:400 clamp(16px,2.2vw,22px)/1.3 "Jost",var(--sans);letter-spacing:.3em;text-transform:uppercase}
.engr.empty{opacity:.35}
.hall{position:absolute;bottom:9px;font:500 9.5px/1 var(--sans);letter-spacing:.22em;color:var(--m-ink);opacity:.55;direction:ltr}
.hall.l{left:18px}.hall.r{right:18px}
.stage-note{position:relative;z-index:1;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.studio-form{display:grid;gap:24px}
.studio-form .intro{color:var(--muted);margin:14px 0 0;max-width:48ch}
.field{display:grid;gap:10px}
.field > label,.field legend{font:500 11.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.text-input{border:0;border-bottom:1px solid var(--ink);background:none;padding:10px 0;font:400 italic 28px/1.2 var(--display);color:var(--ink);width:100%;border-radius:0}
.text-input:focus{outline:none;border-bottom-color:var(--accent)}
.counter{font-size:12px;color:var(--muted);justify-self:end;margin-top:-4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.opt span{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border:1px solid var(--line);padding:.5em 1.1em;font-size:14px;transition:background-color .2s,color .2s,border-color .2s}
.opt:hover span{border-color:var(--accent)}
.opt input:checked + span{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.sizes .opt span{width:100%;padding:.5em 0;font-variant-numeric:tabular-nums}
.readout{font-size:13px;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px}
.total .price{font-size:32px}
.total small{display:block;font:300 12.5px/1.4 var(--sans);color:var(--muted);margin-top:8px}

/* ================= Atelier ================= */
.story{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:center}
.story blockquote{margin:16px 0 0;font:400 italic clamp(26px,3vw,40px)/1.3 var(--display);text-wrap:balance}
html:lang(zh) .story blockquote,html:lang(ja) .story blockquote{font-style:normal}
.story cite{display:block;margin-top:22px;font:400 12px/1.5 var(--sans);letter-spacing:.2em;text-transform:uppercase;font-style:normal;color:var(--band-muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.facts div{background:color-mix(in srgb,var(--band-a) 70%,var(--bg));padding:28px 22px}
.facts b{display:block;font:400 44px/1 var(--display);font-variant-numeric:lining-nums}
.facts span{display:block;margin-top:12px;font-size:13px;color:var(--band-muted)}

/* ================= Newsletter ================= */
.letter{text-align:center;display:grid;justify-items:center;gap:14px}
.letter h2{font-family:var(--script);font-size:clamp(56px,7.5vw,96px);line-height:1.1}
.letter p{color:var(--muted);margin:0;max-width:50ch}
.letter form{display:flex;width:min(540px,100%);margin-top:16px;border:1px solid var(--ink)}
.letter input{flex:1;min-width:0;border:0;background:none;padding:15px 16px;font:300 15px var(--sans);color:var(--ink)}
.letter input:focus{outline:none}
.letter form .btn{border:0}
.form-msg{font-size:14px;color:var(--accent);min-height:1.4em}

/* ================= Footer ================= */
footer.site{background:var(--ink);color:color-mix(in srgb,var(--bg) 72%,var(--ink));padding-block:64px 32px;font-size:14px}
.foot{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
.foot .logo{display:inline-block;font-size:66px;padding-inline:0 .1em}
.foot h4{margin:0 0 14px;font:500 11.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--bg)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot a{text-decoration:none}.foot a:hover{color:var(--bg)}
.legal{margin-top:48px;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12px;letter-spacing:.06em}

/* ================= Bag drawer ================= */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;opacity:0;transition:opacity .35s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);z-index:81;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .5s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-inline-start:1px solid var(--line);visibility:hidden}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.on,html[dir="rtl"] .drawer.on{transform:none;visibility:visible}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:28px}
.x{border:0;background:none;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.x:hover{background:var(--chip)}
.drawer-body{flex:1;overflow:auto;padding:4px 24px}
.line{display:grid;grid-template-columns:68px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.line .ph{aspect-ratio:4/5;width:100%}
.line .ph::before{animation:none}
.line h3{font-size:17px}
.line small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:8px}
.qty button{border:0;background:none;width:30px;height:30px}
.qty span{min-width:22px;text-align:center;font-size:13px}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty .s{display:block;font-size:46px;margin-bottom:6px}
.drawer-foot{padding:20px 24px 24px;border-top:1px solid var(--line);display:grid;gap:12px}
.drawer-foot .row{display:flex;justify-content:space-between;align-items:baseline}
.note{font-size:12px;color:var(--muted);margin:0}

/* ================= Quick view ================= */
dialog.qv{width:min(980px,calc(100% - 32px));max-height:calc(100% - 32px);padding:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:var(--shadow);overflow:auto}
dialog.qv::backdrop{background:var(--scrim);backdrop-filter:blur(4px)}
dialog.qv[open]{animation:qvIn .5s var(--ease)}
@keyframes qvIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
.qv-grid{display:grid;grid-template-columns:1fr 1fr}
.qv-media{padding:clamp(20px,3vw,36px);background:linear-gradient(160deg,var(--band-a),var(--band-b))}
.qv-media .ph{aspect-ratio:4/5;width:100%}
.qv-info{position:relative;padding:clamp(24px,3.4vw,44px);display:grid;align-content:start;gap:20px}
.qv-info .x{position:absolute;top:14px;inset-inline-end:14px}
.qv-info h2{font-size:clamp(32px,3.6vw,44px)}
.qv-info .spec{color:var(--muted);margin:6px 0 0}
.qv-info .desc{margin:0;color:var(--muted);font-size:15px}
.qv-info .price{font-size:28px}
.qv-actions{display:grid;grid-template-columns:1fr auto;gap:10px}
.qv-actions .heart{width:52px;height:auto;border:1px solid var(--line)}
.made{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--ink);color:var(--bg);padding:13px 22px;font-size:14px;transition:opacity .3s,transform .4s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= Responsive ================= */
@media (max-width:1080px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .standards ul{grid-template-columns:1fr 1fr}
  .standards li:nth-child(3){border-inline-start:0;padding-inline-start:0}
  .standards li:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .nav-links,.tool.hide-sm{display:none}
  .menu-btn{display:inline-flex}
  .nav{grid-template-columns:auto 1fr auto}
  .logo{justify-self:center;font-size:46px}
  .hero-grid,.studio,.story,.qv-grid{grid-template-columns:1fr}
  .hero-piece{width:min(320px,80%);order:-1}
  .grid{grid-template-columns:1fr 1fr}
  .colls{flex-direction:column;height:auto}
  .coll{min-height:300px}
  .coll:hover,.coll:focus-visible{flex-grow:1}
  .foot{grid-template-columns:1fr 1fr}
  .foot > div:first-child{grid-column:1/-1}
  .qv-media .ph{max-width:320px;margin-inline:auto}
}
@media (max-width:540px){
  .standards ul,.facts{grid-template-columns:1fr}
  .standards li{border-inline-start:0!important;padding-inline-start:0;border-top:1px solid var(--line)}
  .standards li:first-child{border-top:0}
  .grid{gap:22px 12px}
  .card h3{font-size:17px}
  .actions{grid-template-columns:1fr}
  .actions button:first-child{display:none}
  .tool{padding:0 8px}
  .toolbar{align-items:stretch}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .loader-mark{clip-path:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<!-- Loading page -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="loader-mark gild">Jewl</div>
  <div class="loader-line"><i></i></div>
  <p data-i="loader"></p>
</div>

<div class="announce" data-i="announce"></div>

<header class="site">
  <div class="wrap">
    <nav class="nav" aria-label="Primary">
      <button class="tool menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mobileNav"><span class="glyph" aria-hidden="true">≡</span><span class="sr" data-i="menu"></span></button>
      <ul class="nav-links">
        <li><a href="#shop" data-i="nav_shop"></a></li>

          <button class="tool" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu"><span id="langCode">EN</span><span aria-hidden="true" style="font-size:9px">▼</span></button>
          <ul class="lang-menu" id="langMenu" hidden></ul>
        </div>
        <button class="tool" id="themeBtn"><span class="glyph" id="themeGlyph" aria-hidden="true">☾</span></button>

        <button class="tool" id="bagBtn" aria-controls="drawer"><span data-i="bag"></span><span class="count num" id="bagCount" hidden>0</span></button>

    <div class="mobile-nav" id="mobileNav" hidden>

    </div>
  </div>
</header>

<main id="top">
  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="wrap hero-grid">
      <div>
        <div class="eyebrow" data-i="hero_eyebrow"></div>
        <div class="hero-mark gild" aria-hidden="true">Jewl</div>

      </div>
      <div class="hero-piece">
        <button class="arch-btn" id="heroArch" data-qv="ondine" type="button">
          <div class="ph" data-stone="aqua" data-metal="yellow"><span class="ph-initial">O</span></div>
        </button>
        <div class="arch-cap"><span class="brand gild">Ondine</span><span id="heroCap" class="num"></span></div>
      </div>
    </div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <!-- Standards -->
  <section class="standards">
    <div class="wrap">
      <ul>
        <li><strong data-i="s1t"></strong><span data-i="s1d"></span></li>
        <li><strong data-i="s2t"></strong><span data-i="s2d"></span></li>
        <li><strong data-i="s3t"></strong><span data-i="s3d"></span></li>
        <li><strong data-i="s4t"></strong><span data-i="s4d"></span></li>
      </ul>
    </div>
  </section>

  <!-- Catalog -->
  <section class="block" id="shop">
    <div class="wrap">
      <div class="head">
        <div>
          <div class="eyebrow" data-i="shop_eyebrow"></div>
          <h2 data-i="shop_title"></h2>
        </div>
      </div>
      <div class="toolbar">
        <div class="filters" role="group" id="filters"></div>
        <div class="sorter">
          <span id="showing" class="num" aria-live="polite"></span>
          <label class="sr" for="sort" data-i="sort"></label>
          <select id="sort"></select>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- Collections -->
  <section class="block band-sec" id="collections">
    <div class="aurora" aria-hidden="true" style="opacity:.5"><i></i><i></i><i></i></div>
    <div class="wrap" style="position:relative">
      <div class="head">
        <div>
          <div class="eyebrow" data-i="coll_eyebrow"></div>
          <h2 data-i="coll_title"></h2>

          <span class="brand gild">Lagoon</span>
          <p data-i="c1"></p>
        </button>
        <button class="coll" type="button" data-go="earrings">
          <div class="ph" data-stone="paraiba" data-metal="rose" aria-hidden="true"><span class="ph-initial">T</span></div>
          <small class="num" data-i="pieces" data-n="14"></small>
          <span class="brand gild">Tide</span>
          <p data-i="c2"></p>

        <button class="coll" type="button" data-go="rings">

          <small class="num" data-i="pieces" data-n="16"></small>
          <span class="brand gild">Heirloom</span>
          <p data-i="c3"></p>
        </button>

  <!-- Engraving studio -->

          <div class="eyebrow" data-i="e_eyebrow"></div>

            <label class="opt"><input type="radio" name="metal" id="metal-white" value="white"><span><i class="dot" style="background:var(--g-white)"></i><b style="font-weight:inherit" data-i="white"></b></span></label>
            <label class="opt"><input type="radio" name="metal" id="metal-rose" value="rose"><span><i class="dot" style="background:var(--g-rose)"></i><b style="font-weight:inherit" data-i="rose"></b></span></label>
          </div>

        <fieldset class="field">
          <legend data-i="size"></legend>
          <div class="sizes" id="sizes"></div>
          <span class="readout num" id="readout"></span>
        </fieldset>
        <div class="total">
          <div>
            <div class="price num" id="studioPrice"></div>
            <small id="breakdown" class="num"></small>
          </div>
          <button class="btn btn-ink" type="submit" data-i="e_add"></button>

  </section>

  <!-- Atelier -->
  <section class="block band-sec" id="atelier">
    <div class="wrap story">
      <div>
        <div class="eyebrow" data-i="a_eyebrow"></div>
        <blockquote>
          <span data-i="a_quote"></span>
          <cite data-i="a_cite"></cite>
        </blockquote>
      </div>
      <div class="facts">
        <div><b class="num gild">100%</b><span data-i="f1"></span></div>
        <div><b class="num gild">7</b><span data-i="f2"></span></div>
        <div><b class="num gild" data-i="f3v"></b><span data-i="f3"></span></div>
      </div>
    </div>
  </section>

  <!-- Newsletter -->
  <section class="block">
    <div class="wrap letter">
      <h2 data-i="l_title"></h2>
      <p data-i="l_body"></p>
      <form id="letterForm" novalidate>

const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const st = {
  lang: I18N[document.documentElement.lang] ? document.documentElement.lang : "en",
  cat:"all", sort:"feat",
  wish:new Set(store.get("jewl-wish",[])),
  bag:store.get("jewl-bag",[]).filter(i => PRODUCTS.some(p => p.id===i.pid)),
  cardMetal:{}

const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const t = (k,v={}) => (I18N[st.lang][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
const money = n => new Intl.NumberFormat(LOCALE[st.lang],{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = id => PRODUCTS.find(p=>p.id===id);
const metalOf = p => st.cardMetal[p.id] || p.metal;
const spec = (p,m) => `${t(p.stone)} · ${p.ct} · ${t(m)}`;
const ph = (p,m,extra="") => `<div class="ph" data-stone="${p.stone}" data-metal="${m}" ${extra}><span class="ph-initial">${p.name[0]}</span></div>`;
const fine = matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
const defaultOpt = p => OPTS[p.cat] ? OPTS[p.cat][p.cat==="rings" ? 4 : 1] : null;

/* ================= Language ================= */
const loadedFonts = new Set();
function setLang(l){
  st.lang = l;
  const root = document.documentElement;
  root.lang = l; root.dir = l==="ar" ? "rtl" : "ltr";
  if (FONTS[l] && !loadedFonts.has(l)){
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = `https://fonts.googleapis.com/css2?family=${FONTS[l]}&display=swap`;
    document.head.appendChild(link); loadedFonts.add(l);
  }
  try{localStorage.setItem("jewl-lang", l)}catch(e){}
  renderAll();
}

/* ================= Theme ================= */
const mq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => { const a = document.documentElement.getAttribute("data-theme"); return a ? a==="dark" : mq.matches; };
function syncTheme(){
  $("#themeGlyph").textContent = isDark() ? "☼" : "☾";
  $("#themeBtn").setAttribute("aria-label", t(isDark() ? "to_light" : "to_dark"));
}
$("#themeBtn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{localStorage.setItem("jewl-theme", next)}catch(e){}
  syncTheme();
});
mq.addEventListener?.("change", syncTheme);

/* ================= Catalog ================= */
function renderFilters(){
  $("#filters").innerHTML = [...CATS,"saved"].map(c => `<button class="chip" type="button" data-cat="${c}" aria-pressed="${c===st.cat}">${c==="saved" ? "♡&#xFE0E; "+t("saved") : t(c)}${c==="saved" && st.wish.size ? `<span class="count num">${st.wish.size}</span>` : ""}</button>`).join("");
}
function renderGrid(){
  let list = PRODUCTS.filter(p => st.cat==="all" || (st.cat==="saved" ? st.wish.has(p.id) : p.cat===st.cat));
  if (st.sort==="low") list = [...list].sort((a,b)=>a.price-b.price);
  if (st.sort==="high") list = [...list].sort((a,b)=>b.price-a.price);
  $("#showing").textContent = t("showing",{n:list.length});
  if (!list.length){ $("#grid").innerHTML = `<div class="empty-grid"><span class="s">♡&#xFE0E;</span>${t("no_saved")}</div>`; return; }
  $("#grid").innerHTML = list.map((p,i) => {
    const m = metalOf(p), w = st.wish.has(p.id);
    return `<article class="card" style="--d:${i}">
      <div class="card-media"><div class="tilt">
        ${ph(p,m,`data-qv="${p.id}" aria-hidden="true"`)}
        <div class="actions"><button type="button" data-qv="${p.id}">${t("quick")}</button><button type="button" data-add="${p.id}">${t("add")}</button></div>
      </div></div>
      <div class="card-info">
        <div class="card-tag">${p.tag ? t(p.tag) : ""}</div>
        <div class="card-row"><h3><button type="button" data-qv="${p.id}">${p.name}</button></h3>
          <button class="heart" type="button" data-wish="${p.id}" aria-pressed="${w}" aria-label="${t(w?"wish_rm":"wish_add")}"><span>${w?"♥":"♡"}&#xFE0E;</span></button></div>
        <div class="card-spec">${spec(p,m)}</div>
        <div class="card-row"><span class="price num">${money(p.price)}</span>
          <div class="swatches" role="group" aria-label="${t("metal")}">${METALS.map(x=>`<button class="sw" type="button" data-sw="${x}" data-pid="${p.id}" aria-pressed="${x===m}" aria-label="${t(x)}" style="--sw:var(--g-${x})"></button>`).join("")}</div></div>
      </div></article>`;
  }).join("");
}
$("#filters").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  st.cat = b.dataset.cat; renderFilters(); renderGrid();
});
$("#sort").addEventListener("change", e => { st.sort = e.target.value; renderGrid(); });

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go){ st.cat = go.dataset.go; renderFilters(); renderGrid(); if (go.tagName==="BUTTON") $("#shop").scrollIntoView({behavior:"smooth"}); return; }
  const qv = e.target.closest("[data-qv]"); if (qv) return openQV(qv.dataset.qv);
  const add = e.target.closest("[data-add]");
  if (add){ const p = byId(add.dataset.add); return addToBag({pid:p.id, metal:metalOf(p), opt:defaultOpt(p)}); }
  const w = e.target.closest("[data-wish]"); if (w) return toggleWish(w.dataset.wish);
  const sw = e.target.closest("[data-sw]");
  if (sw){
    const p = byId(sw.dataset.pid); st.cardMetal[p.id] = sw.dataset.sw;
    const card = sw.closest(".card");
    card.querySelector(".ph").dataset.metal = sw.dataset.sw;
    card.querySelector(".card-spec").textContent = spec(p, sw.dataset.sw);
    $$(".sw", card).forEach(s => s.setAttribute("aria-pressed", s===sw));
  }
});

/* Tilt, plus a highlight that follows the pointer */
function tiltable(root, sel, amt){
  if (!fine) return;
  root.addEventListener("pointermove", e => {
    const el = e.target.closest(sel); if (!el) return;
    const r = el.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
    el.style.transform = `rotateY(${(x-.5)*amt}deg) rotateX(${(.5-y)*amt}deg)`;
    const p = el.querySelector(".ph") || el; p.style.setProperty("--mx", x*100+"%"); p.style.setProperty("--my", y*100+"%");
  });
  root.addEventListener("pointerout", e => {
    const el = e.target.closest(sel); if (el && !el.contains(e.relatedTarget)) el.style.transform = "";
  });
}
tiltable($("#grid"), ".tilt", 9);
tiltable($(".hero-piece"), ".arch-btn", 7);

/* ================= Wishlist ================= */
function toggleWish(id){
  const p = byId(id), on = !st.wish.has(id);
  on ? st.wish.add(id) : st.wish.delete(id);
  store.set("jewl-wish", [...st.wish]);
  renderWishCount(); renderFilters(); renderGrid();
  if ($("#qv").open) renderQV();
  toast(t(on ? "toast_wish" : "toast_unwish", {n:p.name}));
}
function renderWishCount(){ const c=$("#wishCount"); c.textContent = st.wish.size; c.hidden = !st.wish.size; }
$("#wishBtn").addEventListener("click", () => { st.cat = "saved"; renderFilters(); renderGrid(); $("#shop").scrollIntoView({behavior:"smooth"}); });

function openQV(id){
  const p = byId(id);
  Object.assign(qvState, {pid:id, metal:metalOf(p), opt:defaultOpt(p)});
  renderQV(); $("#qv").showModal();
}
function renderQV(){
  const p = byId(qvState.pid), w = st.wish.has(p.id), opts = OPTS[p.cat];
  const phEl = $("#qvPh"); phEl.dataset.stone = p.stone; phEl.dataset.metal = qvState.metal; phEl.firstElementChild.textContent = p.name[0];
  const mm = p.cat==="rings" ? SIZES.find(s=>String(s[0])===qvState.opt)?.[1] : null;
  $("#qvInfo").innerHTML = `
    <button class="x" type="button" data-close aria-label="${t("close")}">×</button>
    <div><div class="eyebrow">${t(p.cat)}${p.tag ? " · "+t(p.tag) : ""}</div>
      <h2 style="margin-top:10px">${p.name}</h2>
      <p class="spec">${spec(p,qvState.metal)}</p></div>
    <div class="price num">${money(p.price)}</div>
    <div class="field"><span class="eyebrow" style="color:var(--muted)">${t("metal")}</span>
      <div class="opts">${METALS.map(m=>`<label class="opt"><input type="radio" name="qvm" value="${m}" ${m===qvState.metal?"checked":""}><span><i class="dot" style="background:var(--g-${m})"></i>${t(m)}</span></label>`).join("")}</div></div>
    ${opts ? `<div class="field"><span class="eyebrow" style="color:var(--muted)">${t(p.cat==="rings"?"size":"length")}</span>
      <div class="${p.cat==="rings"?"sizes":"opts"}">${opts.map(o=>`<label class="opt"><input type="radio" name="qvo" value="${o}" ${o===qvState.opt?"checked":""}><span class="num">${o}</span></label>`).join("")}</div>
      ${mm ? `<span class="readout num">${t("e_mm",{s:qvState.opt,mm:mm.toFixed(1)})}</span>` : ""}</div>`
      : `<div class="made" style="color:var(--muted)">${t("pair")}</div>`}
    <p class="desc">${t("d_"+p.cat)}</p>
    <div class="qv-actions"><button class="btn btn-gold" type="button" data-qvadd>${t("add")}</button>
      <button class="heart" type="button" data-wish="${p.id}" aria-pressed="${w}" aria-label="${t(w?"wish_rm":"wish_add")}"><span>${w?"♥":"♡"}&#xFE0E;</span></button></div>
    <div class="made">${t("made")}</div>`;
}
$("#qvInfo").addEventListener("change", e => {
  if (e.target.name==="qvm") qvState.metal = e.target.value;
  if (e.target.name==="qvo") qvState.opt = e.target.value;
  renderQV();
});
$("#qvInfo").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) $("#qv").close();
  if (e.target.closest("[data-qvadd]")){ addToBag({pid:qvState.pid, metal:qvState.metal, opt:qvState.opt}); $("#qv").close(); }
});
$("#qv").addEventListener("click", e => { if (e.target === $("#qv")) $("#qv").close(); });

/* ================= Engraving studio ================= */
$("#sizes").innerHTML = SIZES.map(([s]) => `<label class="opt"><input type="radio" name="size" id="size-${String(s).replace(".","-")}" value="${s}" ${s===6?"checked":""}><span>${s}</span></label>`).join("");
const form = $("#studio"), ins = $("#inscription");
const studio = () => { const f = new FormData(form); return {text:ins.value.trim(), font:f.get("font"), metal:f.get("metal"), size:f.get("size")}; };
function renderStudio(){
  const s = studio(), mm = SIZES.find(x=>String(x[0])===s.size)[1];
  const engr = $("#engr");
  engr.textContent = s.text || t("e_ph"); engr.classList.toggle("empty", !s.text); engr.dataset.font = s.font;
  $("#band").dataset.metal = s.metal; $(".stage").dataset.metal = s.metal;
  $("#hallSize").textContent = `US ${s.size}`;
  $("#counter").textContent = `${ins.value.length} / 18`;
  $("#readout").textContent = t("e_mm",{s:s.size, mm:mm.toFixed(1)});
  $("#studioPrice").textContent = money(BAND + (s.text ? ENGRAVE : 0));
  $("#breakdown").textContent = t("e_break",{band:money(BAND), eng:money(s.text ? ENGRAVE : 0)});
}
form.addEventListener("input", renderStudio);
form.addEventListener("submit", e => { e.preventDefault(); const s = studio(); addToBag({pid:"nocturne", metal:s.metal, opt:s.size, text:s.text, font:s.font}); });

/* ================= Bag ================= */
const drawer = $("#drawer"), scrim = $("#scrim"), bagBtn = $("#bagBtn");
const lineKey = i => [i.pid,i.metal,i.opt,i.text||"",i.font||""].join("|");
const linePrice = i => byId(i.pid).price + (i.text ? ENGRAVE : 0);
function addToBag(item){
  const k = lineKey(item), f = st.bag.find(i => lineKey(i)===k);
  f ? f.qty++ : st.bag.push({...item, qty:1});
  saveBag(); renderBag(); toast(t("toast_add",{n:byId(item.pid).name}));
}
function saveBag(){ store.set("jewl-bag", st.bag); }
function renderBag(){
  const count = st.bag.reduce((n,i)=>n+i.qty,0), c = $("#bagCount");
  c.textContent = count; c.hidden = !count;
  bagBtn.setAttribute("aria-label", `${t("bag")} (${count})`);
  $("#bagFoot").hidden = !count;
  $("#bagBody").innerHTML = !count
    ? `<div class="empty"><span class="s">${t("b_empty")}</span>${t("b_empty_d")}</div>`
    : st.bag.map((i,idx) => { const p = byId(i.pid);
      const det = [t(i.metal), i.opt ? (p.cat==="rings" ? "US "+i.opt : i.opt) : "", i.text ? `“${esc(i.text)}”` : ""].filter(Boolean).join(" · ");
      return `<div class="line">${ph(p,i.metal)}
        <div><h3>${p.name}</h3><small>${det}</small>
          <div class="qty"><button type="button" data-dec="${idx}" aria-label="${t("b_less")}">−</button><span class="num">${i.qty}</span><button type="button" data-inc="${idx}" aria-label="${t("b_more")}">+</button></div></div>
        <span class="price num">${money(linePrice(i)*i.qty)}</span></div>`; }).join("");
  $("#subtotal").textContent = money(st.bag.reduce((n,i)=>n+linePrice(i)*i.qty,0));
}
$("#bagBody").addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc) st.bag[+inc.dataset.inc].qty++;
  if (dec){ const i = +dec.dataset.dec; if (--st.bag[i].qty===0) st.bag.splice(i,1); }
  if (inc||dec){ saveBag(); renderBag(); }
});
function openBag(on){
  if (on){ scrim.hidden = false; requestAnimationFrame(()=>{ scrim.classList.add("on"); drawer.classList.add("on"); }); document.body.classList.add("locked"); setTimeout(()=>$("#closeBag").focus(), 60); }
  else { scrim.classList.remove("on"); drawer.classList.remove("on"); document.body.classList.remove("locked"); setTimeout(()=>scrim.hidden = true, 350); bagBtn.focus(); }
  drawer.setAttribute("aria-hidden", !on);
}
bagBtn.addEventListener("click", () => openBag(true));
$("#closeBag").addEventListener("click", () => openBag(false));
scrim.addEventListener("click", () => openBag(false));
$("#checkout").addEventListener("click", () => { $("#checkoutNote").hidden = false; });

/* ================= Header menus ================= */
const langBtn = $("#langBtn"), langMenu = $("#langMenu");
function showLang(on){ langMenu.hidden = !on; langBtn.setAttribute("aria-expanded", on); if (on) langMenu.querySelector('[aria-current="true"]')?.focus(); }
langBtn.addEventListener("click", e => { e.stopPropagation(); showLang(langMenu.hidden); });
langMenu.addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b){ setLang(b.dataset.lang); showLang(false); langBtn.focus(); } });
document.addEventListener("click", e => { if (!langMenu.hidden && !e.target.closest(".lang-wrap")) showLang(false); });
document.addEventListener("keydown", e => {
  if (e.key!=="Escape") return;
  if (!langMenu.hidden){ showLang(false); langBtn.focus(); }
  if (drawer.classList.contains("on")) openBag(false);
});
const menuBtn = $("#menuBtn"), mnav = $("#mobileNav");
menuBtn.addEventListener("click", () => { mnav.hidden = !mnav.hidden; menuBtn.setAttribute("aria-expanded", !mnav.hidden); });
mnav.addEventListener("click", e => { if (e.target.closest("a")){ mnav.hidden = true; menuBtn.setAttribute("aria-expanded","false"); } });

/* ================= Newsletter ================= */
$("#letterForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#email").value.trim();
  $("#letterMsg").textContent = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? t("l_ok",{e:v}) : t("l_err");
});

/* ================= Toast ================= */
let tId;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(tId); tId = setTimeout(()=>el.classList.remove("on"), 2600); }

/* ================= Boot ================= */
function renderAll(){ applyStatic(); renderFilters(); renderGrid(); renderStudio(); renderBag(); renderWishCount(); if ($("#qv").open) renderQV(); }
setLang(st.lang);
if (document.fonts?.ready) document.fonts.ready.then(renderStudio);

/* Loading page: holds ~2s so the signature can write itself in, then fades */
const loader = $("#loader"), t0 = performance.now();
const minMs = matchMedia("(prefers-reduced-motion: reduce)").matches ? 400 : 2100;
const hideLoader = () => setTimeout(() => loader.classList.add("done"), Math.max(0, minMs - (performance.now()-t0)));
document.readyState === "complete" ? hideLoader() : addEventListener("load", hideLoader);
loader.addEventListener("click", () => loader.classList.add("done"));
})();
</script>
</body>
</html>
